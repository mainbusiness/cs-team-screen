# Render Blueprint — CS team screen. One web service + one persistent disk.
# Values are NOT in this file: set them in the Render dashboard (sync: false = declared, no value).
services:
  - type: web
    name: cs-team-screen
    runtime: python
    plan: starter                      # a persistent disk needs a paid instance; a disk also means 1 instance
    region: frankfurt
    # rootDir: Systems/CS_Engine/team_screen   # only if the repo root is the whole HQ tree
    buildCommand: pip install -r requirements.txt
    # ONE worker on purpose: the login rate limiter and the users-file lock live in this process.
    # Threads give concurrency (engine calls block 1-20s; an assistant turn with tools can take ~60-110s).
    startCommand: gunicorn --workers 1 --threads 16 --timeout 150 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    disk:
      name: cs-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TOKEN_SECRET              # same value as the TOKEN_SECRET Script Property of every brand engine (32+ chars)
        sync: false
      - key: ENGINES_JSON              # {"rozela":"https://script.google.com/.../exec", ...}
        sync: false
      - key: SECRET_KEY                # Flask session signing key (32+ random chars), Render-only
        sync: false
      - key: ADMIN_BOOTSTRAP           # "username:password" for the FIRST admin only — delete after first boot
        sync: false
      - key: ANTHROPIC_API_KEY         # phase 5: knowledge assistant (claude-opus-5-5) + English mode (claude-sonnet-5-5)
        sync: false
      - key: USERS_PATH
        value: /var/data/users.json
      - key: TICKET_CACHE_DIR          # Render-side ticket cache on the private disk (0700)
        value: /var/data/ticket-cache
      - key: PYTHON_VERSION
        value: 3.12.7
